<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABR Korea — 미국야구학회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<!-- Quill Editor -->
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2A6B;--navy2:#142060;--red:#C0231B;--red2:#E02820;
  --bg:#FFFFFF;--bg2:#F7F7F5;--bg3:#F0F0EC;
  --t1:#111111;--t2:#555555;--t3:#999999;
  --border:#E5E5E5;--border2:#D0D0D0;
  --sans:'Noto Sans KR',sans-serif;
  --serif:'Noto Serif KR','Playfair Display',serif;
  --r:4px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);line-height:1.6;font-size:15px}
a{text-decoration:none;color:inherit}
button{font-family:var(--sans)}
::selection{background:var(--navy);color:#fff}

/* HEADER */
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.hdr-main{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:68px;gap:2rem}
.logo{display:flex;align-items:center;cursor:pointer}
.logo img{width:46px;height:46px;object-fit:contain}
nav{display:flex;gap:0;align-items:center;flex:1;padding-left:1rem}
nav button{background:none;border:none;cursor:pointer;color:var(--t2);font-size:13.5px;font-weight:500;padding:0 16px;height:68px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;white-space:nowrap}
nav button:hover{color:var(--navy)}
nav button.act{color:var(--navy);border-bottom-color:var(--red)}
.hdr-right{display:flex;align-items:center;gap:12px}
.lang-sw{display:flex;background:var(--bg3);border-radius:99px;padding:3px;gap:2px;border:1px solid var(--border2)}
.lbtn{background:none;border:none;cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t3);padding:5px 12px;border-radius:99px;transition:background .15s,color .15s;font-family:var(--sans)}
.lbtn.on{background:var(--navy);color:#fff}
.btn-write{background:var(--red);color:#fff;border:none;cursor:pointer;font-size:13px;font-weight:600;padding:8px 18px;border-radius:99px;transition:background .15s;white-space:nowrap}
.btn-write:hover{background:var(--red2)}

/* HERO */
.hero-banner{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,#0D1845 100%);padding:4rem 2rem;position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 80% at 80% 50%,rgba(192,35,27,.15) 0%,transparent 70%);pointer-events:none}
.hero-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:1.2rem}
.hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--red)}
.hero-h1{font-family:var(--sans);font-size:clamp(1.8rem,3.5vw,2.8rem);color:#fff;line-height:1.2;margin-bottom:1rem;font-weight:700}
.hero-desc{font-size:14px;color:rgba(255,255,255,.6);line-height:1.8;max-width:440px;margin-bottom:2rem}
.hero-stats{display:flex;gap:2.5rem}
.hst{display:flex;flex-direction:column;gap:4px}
.hst-n{font-size:2rem;font-weight:700;color:#fff;line-height:1;font-family:var(--serif)}
.hst-l{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.1em;text-transform:uppercase}
.hero-img-wrap{display:flex;justify-content:center;align-items:center}
.hero-logo-big{width:200px;height:200px;object-fit:contain;opacity:.85;filter:drop-shadow(0 8px 32px rgba(0,0,0,.4))}

/* PAGE */
.page{display:none}
.container{max-width:1200px;margin:0 auto;padding:0 2rem}
.layout{display:grid;grid-template-columns:1fr 320px;gap:3rem;padding:3rem 0}

/* SECTION HEAD */
.sh{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;margin-bottom:1.5rem;border-bottom:2px solid var(--t1)}
.sh-title{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--t1)}
.sh-more{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:3px;transition:color .15s}
.sh-more:hover{color:var(--navy)}

/* ARTICLE LIST */
.aitem{display:grid;grid-template-columns:160px 1fr;gap:1.2rem;padding:1.4rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.aitem:hover .aitem-title{color:var(--navy)}
.aitem.featured{grid-template-columns:1fr;margin-bottom:1.5rem;border:1px solid var(--border);border-radius:6px;overflow:hidden;padding:0}
.feat-img{width:100%;aspect-ratio:16/7;background:linear-gradient(135deg,var(--navy) 0%,#2a3f8f 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.feat-img img{width:90px;height:90px;object-fit:contain;opacity:.2}
.feat-img-label{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:2rem 1.5rem .8rem}
.aitem-thumb{width:160px;height:105px;border-radius:4px;overflow:hidden;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.aitem-thumb img.logo-placeholder{width:44px;height:44px;object-fit:contain;opacity:.15}
.aitem-thumb img.thumb-real{width:100%;height:100%;object-fit:cover;display:block;opacity:1}
.aitem-body{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0}
.cat-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.cat-tag::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.ct-sabermetrics{color:#1B5FA8}.ct-sabermetrics::before{background:#1B5FA8}
.ct-analysis{color:#1A7A5A}.ct-analysis::before{background:#1A7A5A}
.ct-history{color:#8A5C1A}.ct-history::before{background:#8A5C1A}
.ct-prospect{color:#7B1FA2}.ct-prospect::before{background:#7B1FA2}
.ct-default{color:var(--red)}.ct-default::before{background:var(--red)}
.aitem-title{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--t1);line-height:1.4;margin-bottom:6px;transition:color .15s}
.aitem.featured .aitem-title{font-size:1.3rem;color:#fff}
.aitem-exc{font-size:13px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.aitem-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}
.aitem-meta .sep{color:var(--border2)}
.aitem.featured .aitem-meta{color:rgba(255,255,255,.5)}

/* LOADING / EMPTY */
.loading{padding:4rem;text-align:center;color:var(--t3);font-size:14px}
.empty{padding:4rem 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty-ico{font-size:3rem}.empty-t{font-family:var(--serif);font-size:1.2rem;color:var(--t1)}.empty-d{font-size:13px;color:var(--t3)}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:2rem}
.sb-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:1.5rem}
.sb-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--t1);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--t1)}
.sb-item{padding:.8rem 0;border-bottom:1px solid var(--border);cursor:pointer;transition:padding-left .15s}
.sb-item:last-child{border-bottom:none;padding-bottom:0}
.sb-item:hover{padding-left:4px}
.sb-item-title{font-size:13px;font-weight:500;color:var(--t1);line-height:1.4;margin-bottom:4px}
.sb-item:hover .sb-item-title{color:var(--navy)}
.sb-item-meta{font-size:11px;color:var(--t3)}
.sb-about{font-size:13px;color:var(--t2);line-height:1.7}
.sb-logo{width:60px;margin:0 auto 1rem;display:block}
.btn-join{display:block;width:100%;background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:600;padding:10px;border-radius:var(--r);cursor:pointer;margin-top:1rem;transition:background .15s;text-align:center}
.btn-join:hover{background:var(--navy2)}

/* ABOUT */
.abt-h{font-family:var(--sans);font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;color:var(--navy);margin-bottom:1rem;line-height:1.2}
.abt-lead{font-size:15px;color:var(--t2);line-height:1.9;margin-bottom:1rem}
.abt-feats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:2rem}
.af{background:#fff;padding:1.2rem;transition:background .2s}.af:hover{background:var(--bg2)}
.af-ico{font-size:1.2rem;margin-bottom:6px}.af-t{font-size:13px;font-weight:700;color:var(--t1);margin-bottom:3px}.af-d{font-size:12px;color:var(--t3);line-height:1.5}

100%{transform:translateX(-50%)}}

/* DRAWER (article reader) */












/* ARTICLE READER */
.art-cat{display:inline-flex;align-items:center;gap:5px;margin-bottom:1rem;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.art-title{font-family:var(--serif);font-size:clamp(1.4rem,3vw,1.8rem);font-weight:700;color:var(--t1);line-height:1.25;margin-bottom:1rem}
.art-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:1.5rem;margin-bottom:1.5rem;border-bottom:1px solid var(--border);font-size:12px;color:var(--t3)}
.art-meta strong{color:var(--t2);font-weight:600}
.art-body{font-size:15px;line-height:2;color:var(--t2);white-space:pre-wrap}
.art-body p{margin-bottom:1.2rem}

/* EDITOR PAGE (fullscreen) */
.editor-page{position:fixed;inset:0;z-index:995;background:#fff;display:none;flex-direction:column;overflow:hidden}
.editor-page.open{display:flex}
.editor-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.editor-hdr-title{font-size:14px;font-weight:700;color:var(--t1)}
.editor-hdr-actions{display:flex;gap:10px;align-items:center}
.btn-cancel{background:none;border:1px solid var(--border2);color:var(--t2);font-size:13px;padding:7px 18px;border-radius:99px;cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--t1);color:var(--t1)}
.btn-publish{background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:600;padding:8px 22px;border-radius:99px;cursor:pointer;transition:background .15s}
.btn-publish:hover{background:var(--navy2)}
.btn-publish:disabled{background:var(--t3);cursor:not-allowed}
.editor-meta{display:flex;gap:1rem;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap;align-items:center}
.editor-meta input,.editor-meta select{border:1px solid var(--border2);background:#fff;border-radius:var(--r);padding:7px 12px;font-family:var(--sans);font-size:13px;color:var(--t1);outline:none}
.editor-meta input:focus,.editor-meta select:focus{border-color:var(--navy)}
.editor-meta input.title-input{flex:1;min-width:200px;font-size:15px;font-weight:600}
.editor-meta select{cursor:pointer}
.editor-body{flex:1;overflow-y:auto;padding:0}
.editor-title-wrap{padding:2rem 2rem 0;border-bottom:none}
.editor-title-input{width:100%;border:none;outline:none;font-family:var(--serif);font-size:clamp(1.5rem,3vw,2rem);font-weight:700;color:var(--t1);line-height:1.3;padding:.5rem 0;border-bottom:1px solid var(--border);margin-bottom:0}
.editor-title-input::placeholder{color:var(--t3)}
.editor-quill-wrap{padding:0 2rem}
.ql-container{border:none !important;font-family:var(--sans) !important}
.ql-toolbar{border:none !important;border-bottom:1px solid var(--border) !important;padding:6px 0 !important;position:sticky;top:0;background:#fff;z-index:1;flex-wrap:wrap}
.ql-editor{font-family:var(--sans) !important;font-size:15px !important;line-height:2 !important;color:var(--t2) !important;min-height:600px;padding:1.5rem 0 4rem !important}
.ql-editor p{margin-bottom:1rem}
[contenteditable]:empty:before{content:attr(data-placeholder);color:var(--t3);pointer-events:none}
.ql-editor h2{font-family:var(--sans);font-size:1.2rem;font-weight:700;color:var(--t1);margin:2rem 0 1rem}
.ql-editor img{max-width:100%;height:auto;border-radius:4px;margin:1rem 0;display:block}
.ql-color-picker .ql-picker-options{top:auto !important;bottom:100%}
.ql-toolbar .ql-picker-label{padding:0 4px}
.ql-snow .ql-picker.ql-size .ql-picker-label::before{content:attr(data-value) !important}
.ql-editor blockquote{border-left:3px solid var(--red);padding-left:1rem;color:var(--t2);font-style:italic;margin:1.5rem 0}
/* lang tabs in editor */
.lang-tabs{display:flex;gap:0;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.lang-tab{background:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600;padding:6px 14px;color:var(--t3);transition:all .15s}
.lang-tab.on{background:var(--navy);color:#fff}

/* FORM small */
.fgroup{margin-bottom:1.25rem}
.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);margin-bottom:7px}
.finput,.fselect{width:100%;background:#fff;border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;font-family:var(--sans);font-size:14px;color:var(--t1);outline:none;transition:border-color .15s}
.finput:focus,.fselect:focus{border-color:var(--navy)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn-submit{width:100%;background:var(--navy);color:#fff;border:none;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:700;padding:13px;border-radius:var(--r);margin-top:.5rem;transition:background .15s}
.btn-submit:hover{background:var(--navy2)}

/* ARTICLE FULL PAGE */
.article-page{display:none;min-height:100vh;background:#fff}
.article-page.open{display:block}
.art-page-hdr{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:60px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:50}
.art-page-back{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--t2);font-family:var(--sans);transition:color .15s}
.art-page-back:hover{color:var(--navy)}
.art-page-edit{background:none;border:1px solid var(--border2);color:var(--t2);font-size:12px;padding:6px 16px;border-radius:99px;cursor:pointer;font-family:var(--sans);transition:all .15s}
.art-page-edit:hover{border-color:var(--navy);color:var(--navy)}
.art-page-inner{max-width:760px;margin:0 auto;padding:3rem 2rem 6rem}
.art-prog{height:3px;background:var(--border);position:fixed;top:60px;left:0;right:0;z-index:49}
.art-prog-bar{height:100%;background:var(--red);width:0%;transition:width .1s}
/* TOAST */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);z-index:9999;background:var(--t1);color:#fff;padding:.85rem 1.5rem;border-radius:var(--r);font-size:13px;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* FOOTER */
footer{background:var(--bg2);border-top:1px solid var(--border);padding:1.5rem 2rem;text-align:center}
footer a{font-size:13px;color:var(--t3);text-decoration:none;transition:color .15s}
footer a:hover{color:var(--navy)}

/* RESPONSIVE */
@media(max-width:960px){.layout{grid-template-columns:1fr}.sidebar{display:none}.hero-inner{grid-template-columns:1fr}.hero-img-wrap{display:none}.abt-feats{grid-template-columns:1fr 1fr}}
@media(max-width:640px){
  .hdr-main{padding:0 1rem;height:56px;gap:1rem}
  nav button{padding:0 8px;font-size:12px}
  .logo img{width:38px;height:38px}
  .lbtn{padding:4px 8px;font-size:10px}
  .btn-write{font-size:12px;padding:7px 14px}
  .container{padding:0 1rem}
  .hero-banner{padding:2rem 1rem 2rem}
  .hero-h1{font-size:clamp(1.6rem,7vw,2.2rem)}
  .hero-stats{gap:1.5rem}
  .hst-n{font-size:1.5rem}
  .aitem{grid-template-columns:100px 1fr;gap:.8rem}
  .aitem-thumb{width:100px;height:70px}
  .aitem-title{font-size:13.5px}
  .abt-feats{grid-template-columns:1fr}

  .editor-meta{flex-direction:column;align-items:stretch}
  .editor-meta input.title-input{font-size:13px}
  .frow{grid-template-columns:1fr}
}
@media(max-width:380px){nav button{padding:0 6px;font-size:11px}.hero-h1{font-size:1.4rem}}

/* 모바일 에디터 추가 대응 */
@media(max-width:640px){
  .editor-hdr{padding:0 1rem;height:52px;gap:.5rem}
  .editor-hdr-title{font-size:13px}
  .editor-hdr-actions{gap:6px}
  .btn-cancel{padding:6px 12px;font-size:12px}
  .btn-publish{padding:7px 14px;font-size:12px}
  .lang-tabs .lang-tab{padding:5px 10px;font-size:11px}
  .editor-meta{padding:.75rem 1rem;gap:.6rem}
  .editor-quill-wrap{padding:1rem 1rem .5rem}
  .editor-title-input{font-size:1.1rem}
  .ql-editor{min-height:300px}
  .ql-toolbar .ql-formats{margin-right:6px}
  #fab-write{bottom:1.5rem;right:1.5rem;width:50px;height:50px;font-size:1.3rem}

  .art-title{font-size:1.2rem}
}
</style>
</head>
<body>

<script>
// 페이지 로드 즉시 모든 섹션 숨김
document.addEventListener('DOMContentLoaded',function(){
  ['pg-home','pg-columns','pg-about'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.style.display='none';
  });
});
</script>
<header>
  <div class="hdr-main">
    <div class="logo" onclick="showPage('home')">
      <img id="logo-img" src="" alt="SABR Logo">
    </div>
    <nav>
      <button class="act" id="nav-home" onclick="showPage('home')"></button>
      <button id="nav-columns" onclick="showPage('columns')"></button>
      <button id="nav-about" onclick="showPage('about')"></button>
    </nav>
    <div class="hdr-right">
      <div class="lang-sw">
        <button class="lbtn on" id="lb-ko" onclick="setLang('ko')">KO</button>
        <button class="lbtn" id="lb-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</header>

<!-- HOME -->
<div id="pg-home" class="page">
  <div class="hero-banner">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="hero-eyebrow" id="hero-eyebrow"></div>
        <h1 class="hero-h1" id="hero-h1"></h1>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-stats">
          <div class="hst"><div class="hst-n">7,500+</div><div class="hst-l" id="hst-l1"></div></div>
          <div class="hst"><div class="hst-n">70+</div><div class="hst-l" id="hst-l2"></div></div>
          <div class="hst"><div class="hst-n">1971</div><div class="hst-l" id="hst-l3"></div></div>
        </div>
      </div>
      <div class="hero-img-wrap">
        <img class="hero-logo-big" id="hero-logo" src="" alt="SABR">
      </div>
    </div>
  </div>
  <div class="container">
    <div class="layout">
      <main>
        <div class="sh">
          <div class="sh-title" id="sh-home"></div>
          <button class="sh-more" id="sh-more" onclick="showPage('columns')"></button>
        </div>
        <div id="list-home"><div class="loading">⚾ 불러오는 중...</div></div>
      </main>
      <aside class="sidebar">
        <div class="sb-card">
          <div class="sb-title" id="sb-recent-title"></div>
          <div class="sb-list" id="sb-recent"></div>
        </div>
        <div class="sb-card">
          <div style="text-align:center"><img class="sb-logo" id="sb-logo" src="" alt="SABR"></div>
          <div class="sb-title" id="sb-about-title"></div>
          <div class="sb-about" id="sb-about-text"></div>
          <button class="btn-join" id="btn-join" onclick="showPage('about')"></button>
        </div>
      </aside>
    </div>

// ── PASSWORD CHECK ──
function checkPassword(action) {
  const pw = prompt(action === 'ko' ? '비밀번호를 입력하세요:' : 'Enter password:');
  if (pw === null) return false;
  if (pw !== ADMIN_PW) {
    showToast(lang === 'ko' ? '비밀번호가 틀렸습니다.' : 'Incorrect password.');
    return false;
  }
  return true;
}


// ── THUMBNAIL ──
let thumbnailBase64 = null;

function previewThumb(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) { showToast('대표 이미지는 3MB 이하만 가능합니다.'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    thumbnailBase64 = e.target.result;
    document.getElementById('thumb-img').src = thumbnailBase64;
    document.getElementById('thumb-preview').style.display = 'flex';
    document.getElementById('thumb-label').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function clearThumb() {
  thumbnailBase64 = null;
  document.getElementById('e-thumbnail').value = '';
  document.getElementById('thumb-preview').style.display = 'none';
  document.getElementById('thumb-label').style.display = 'flex';
}

let lang = 'ko';

// ── QUILL INIT ──
function initQuill() {
  const opts = {
    theme: 'snow',
    placeholder: '',
    modules: {
      toolbar: [
        ['bold','italic','underline','strike'],
        [{color:[]},{background:[]}],
        [{header:[1,2,3,false]}],
        [{size:['small',false,'large','huge']}],
        ['blockquote','code-block'],
        [{list:'ordered'},{list:'bullet'},{indent:'-1'},{indent:'+1'}],
        [{align:[]}],
        ['link','image'],
        ['clean']
      ]
    }
  };
  quillKo = new Quill('#quill-ko', {...opts, placeholder:'본문을 입력하세요...'});
  quillEn = new Quill('#quill-en', {...opts, placeholder:'Write your column here...'});

  // 이미지 핸들러
  function imageHandler(quillInstance) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.click();
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast('이미지는 5MB 이하만 가능합니다.');
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const range = quillInstance.getSelection(true);
        quillInstance.insertEmbed(range.index, 'image', e.target.result);
        quillInstance.setSelection(range.index + 1);
      };
      reader.readAsDataURL(file);
    };
  }

  quillKo.getModule('toolbar').addHandler('image', () => imageHandler(quillKo));
  quillEn.getModule('toolbar').addHandler('image', () => imageHandler(quillEn));
}

// ── HELPERS ──
function setEl(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function setHTML(id,v){const e=document.getElementById(id);if(e)e.innerHTML=v;}
function catClass(c){return'ct-'+(c||'default');}
function catLabel(c){return T[lang].catLabels[c]||c||'';}
function fmtDate(d){return d?d.slice(0,10).replace(/-/g,'.'):''}

// ── SUPABASE DATA ──
async function fetchColumns() {
  try {
    const { data, error } = await db.from('columns').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    return data || [];
  } catch(e) {
    console.error('Fetch error:', e);
    return [];
  }
}

// ── RENDER ──
function makeCard(col, idx, featured) {
  const title = lang === 'ko' ? (col.title_ko || col.title_en) : (col.title_en || col.title_ko);
  const summary = lang === 'ko' ? (col.summary_ko || col.summary_en) : (col.summary_en || col.summary_ko);
  const rt = col.read_time || '5';
  if (featured && idx === 0) {
    return `<div class="aitem featured" onclick="openArticle('${col.id}')">
      <div class="feat-img" style="${col.thumbnail ? `background-image:url(${col.thumbnail});background-size:cover;background-position:center` : ''}">${col.thumbnail ? '' : `<img src="${LOGO_SRC}" alt="">`}<div class="feat-img-label">
        <div class="cat-tag ${catClass(col.category)}" style="color:rgba(255,255,255,.7)">${catLabel(col.category)}</div>
        <div class="aitem-title">${title}</div>
        <div class="aitem-meta"><strong>${col.author}</strong><span class="sep">·</span><span>${fmtDate(col.created_at)}</span><span class="sep">·</span><span>${rt}${T[lang].readTime}</span></div>
      </div></div>
    </div>`;
  }
  return `<div class="aitem" onclick="openArticle('${col.id}')">
    <div class="aitem-thumb">${col.thumbnail ? `<img class="thumb-real" src="${col.thumbnail}" alt="">` : `<img class="logo-placeholder" src="${LOGO_SRC}" alt="">`}</div>
    <div class="aitem-body">
      <div class="cat-tag ${catClass(col.category)}">${catLabel(col.category)}</div>
      <div class="aitem-title">${title}</div>
      <div class="aitem-exc">${summary||''}</div>
      <div class="aitem-meta"><strong>${col.author}</strong><span class="sep">·</span><span>${fmtDate(col.created_at)}</span><span class="sep">·</span><span>${rt}${T[lang].readTime}</span></div>
    </div>
  </div>`;
}

function renderHome() {
  const t = T[lang];
  const cols = allColumns;
  if (!cols.length) {
    setHTML('list-home', `<div class="empty"><div class="empty-ico">⚾</div><div class="empty-t">${t.emptyT}</div><div class="empty-d">${t.emptyD}</div></div>`);
  } else {
    setHTML('list-home', cols.slice(0, 7).map((c, i) => makeCard(c, i, true)).join(''));
  }
  setHTML('sb-recent', cols.slice(0, 5).map(c => {
    const title = lang === 'ko' ? (c.title_ko || c.title_en) : (c.title_en || c.title_ko);
    return `<div class="sb-item" onclick="openArticle('${c.id}')"><div class="sb-item-title">${title}</div><div class="sb-item-meta">${c.author} · ${fmtDate(c.created_at)}</div></div>`;
  }).join(''));
}

function renderAll() {
  const t = T[lang];
  const cols = allColumns;
  if (!cols.length) {
    setHTML('list-all', `<div class="empty"><div class="empty-ico">⚾</div><div class="empty-t">${t.emptyT}</div><div class="empty-d">${t.emptyD}</div></div>`);
  } else {
    setHTML('list-all', cols.map((c, i) => makeCard(c, i, false)).join(''));
  }
}

// ── LANG ──
function setLang(l) {
  lang = l;
  document.getElementById('lb-ko').classList.toggle('on', l==='ko');
  document.getElementById('lb-en').classList.toggle('on', l==='en');
  const t = T[l];
  const navIds = ['nav-home','nav-columns','nav-about'];
  navIds.forEach((id,i) => setEl(id, t.nav[i]));
  setEl('hero-eyebrow', t.heroEyebrow);
  setEl('hero-h1', t.heroH1);
  setHTML('hero-desc', t.heroDesc);
  t.hstL.forEach((lb,i) => setEl('hst-l'+(i+1), lb));
  setEl('sh-home', t.shHome); setEl('sh-more', t.shMore); setEl('sh-col', t.shCol);
  setEl('sb-recent-title', t.sbRecent); setEl('sb-about-title', t.sbAbout);
  setEl('sb-about-text', t.sbAboutText); setEl('btn-join', t.btnJoin);
  setEl('abt-eyebrow', t.abtEyebrow); setEl('abt-h', t.abtH);
  setEl('abt-p1', t.abtP1); setEl('abt-p2', t.abtP2);
  t.abtFeats.forEach(([title,desc],i)=>{setEl('af'+(i+1)+'-t',title);setEl('af'+(i+1)+'-d',desc);});
  setEl('btn-member-join', t.btnMemberJoin);
  setEl('drw-read-title', t.drwRead);
  setEl('editor-hdr-title', t.editorTitle);
  setEl('btn-cancel', t.btnCancel); setEl('btn-publish', t.btnPublish);
  renderHome(); renderAll();
}

// ── PAGES ──
function showPage(id) {
  window._prevPage = id;
  ['home','columns','about'].forEach(p => {
    const el = document.getElementById('pg-'+p);
    if(el) {
      el.style.display = 'none';
      el.style.visibility = 'hidden';
      el.style.position = 'absolute';
      el.style.pointerEvents = 'none';
    }
  });
  const active = document.getElementById('pg-'+id);
  if(active) {
    active.style.display = 'block';
    active.style.visibility = 'visible';
    active.style.position = 'relative';
    active.style.pointerEvents = 'auto';
  }
  ['nav-home','nav-columns','nav-about'].forEach((nid,i) => {
    document.getElementById(nid).classList.toggle('act', ['home','columns','about'][i]===id);
  });
  if(id==='columns') renderAll();
  const fab = document.getElementById('fab-write');
  if(fab) fab.style.display = id==='columns' ? 'flex' : 'none';
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── ARTICLE READER ──
function openArticle(id) {
  const col = allColumns.find(c => c.id === id);
  if (!col) return;
  const title = lang==='ko' ? (col.title_ko||col.title_en) : (col.title_en||col.title_ko);
  const body = lang==='ko' ? (col.body_ko||col.body_en) : (col.body_en||col.body_ko);
  const rt = col.read_time||'5';
  setHTML('art-body', `
    <div class="art-cat ${catClass(col.category)}">${catLabel(col.category)}</div>
    <div class="art-title">${title}</div>
    <div class="art-meta">
      <strong>${col.author}</strong><span>·</span><span>${fmtDate(col.created_at)}</span><span>·</span><span>${rt}${T[lang].readTime}</span>
      <button onclick="closeArticle();openEditor('${col.id}')" style="margin-left:auto;background:none;border:1px solid var(--border2);color:var(--t2);font-size:11px;padding:4px 12px;border-radius:99px;cursor:pointer;font-family:var(--sans)">${lang==='ko'?'수정':'Edit'}</button>
    </div>
    <div class="art-body">${body}</div>`);
  window.scrollTo(0, 0);
  document.getElementById('prog-bar').style.width = '0%';
  const artPage = document.getElementById('article-page');
  artPage.classList.add('open');
  // 모든 일반 페이지 숨기기
  ['pg-home','pg-columns','pg-about'].forEach(id => {
    const el = document.getElementById(id);
    if(el){ el.style.display='none'; el.style.visibility='hidden'; }
  });
  document.getElementById('fab-write').style.display = 'none';
  // 스크롤 진행 업데이트 (window 기준)
  window._artScrollHandler = () => updateProgress();
  window.addEventListener('scroll', window._artScrollHandler);
}
function closeArticle() {
  document.getElementById('article-page').classList.remove('open');
  if(window._artScrollHandler) {
    window.removeEventListener('scroll', window._artScrollHandler);
    window._artScrollHandler = null;
  }
  // 이전 페이지 복원
  const prevPage = window._prevPage || 'home';
  showPage(prevPage);
}
function updateProgress() {
  const scrollTop = window.scrollY || document.documentElement.scrollTop;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const pct = docHeight > 0 ? (scrollTop / docHeight * 100) : 0;
  document.getElementById('prog-bar').style.width = Math.min(100, pct) + '%';
}
function closeAll() {}

// ── EDITOR ──
async function openEditor(colId) {
  if (!checkPassword(lang)) return;
  editingColumnId = colId || null;

  // 항상 먼저 초기화
  clearEditor();
  document.getElementById('editor-page').classList.add('open');
  document.body.style.overflow = 'hidden';

  const t = T[lang];
  setEl('editor-hdr-title', editingColumnId ? (lang==='ko' ? '칼럼 수정' : 'Edit Column') : t.editorTitle);

  if (!quillKo) {
    setTimeout(async () => {
      initQuill();
      if (editingColumnId) await fillQuillContent();
    }, 50);
  } else {
    if (editingColumnId) await fillQuillContent();
  }
}

async function fillQuillContent() {
  // DB에서 직접 최신 데이터 fetch (캐시 문제 방지)
  let col;
  try {
    const { data } = await db.from('columns').select('*').eq('id', editingColumnId).single();
    col = data;
  } catch(e) {
    col = allColumns.find(c => c.id === editingColumnId);
  }
  if (!col) return;

  // 텍스트 필드 채우기
  document.getElementById('e-author').value = col.author || '';
  document.getElementById('e-readtime').value = col.read_time || '';
  document.getElementById('e-title-ko').value = col.title_ko || '';
  document.getElementById('e-title-en').value = col.title_en || '';
  document.getElementById('e-summary-ko').textContent = col.summary_ko || '';
  document.getElementById('e-summary-en').textContent = col.summary_en || '';

  // Quill 본문 채우기
  if (quillKo) quillKo.root.innerHTML = col.body_ko || '';
  if (quillEn) quillEn.root.innerHTML = col.body_en || '';

  // 썸네일 복원
  if (col.thumbnail) {
    thumbnailBase64 = col.thumbnail;
    document.getElementById('thumb-img').src = col.thumbnail;
    document.getElementById('thumb-preview').style.display = 'flex';
    document.getElementById('thumb-label').style.display = 'none';
  }
}
function closeEditor() {
  document.getElementById('editor-page').classList.remove('open');
  document.body.style.overflow = '';
  editingColumnId = null;
  clearEditor();
}
function clearEditor() {
  document.getElementById('e-author').value = '';
  document.getElementById('e-title-ko').value = '';
  document.getElementById('e-title-en').value = '';
  document.getElementById('e-readtime').value = '';
  document.getElementById('e-summary-ko').textContent = '';
  document.getElementById('e-summary-en').textContent = '';
  if(quillKo) quillKo.setContents([]);
  if(quillEn) quillEn.setContents([]);
  clearThumb();
}
function switchEditorLang(l) {
  editorLang = l;
  document.getElementById('etab-ko').classList.toggle('on', l==='ko');
  document.getElementById('etab-en').classList.toggle('on', l==='en');
  document.getElementById('editor-ko').style.display = l==='ko' ? 'flex' : 'none';
  document.getElementById('editor-en').style.display = l==='en' ? 'flex' : 'none';
}

async function publishColumn() {
  const author = document.getElementById('e-author').value.trim();
  const titleKo = document.getElementById('e-title-ko').value.trim();
  const titleEn = document.getElementById('e-title-en').value.trim();
  const bodyKo = quillKo ? quillKo.root.innerHTML : '';
  const bodyEn = quillEn ? quillEn.root.innerHTML : '';
  const summaryKo = document.getElementById('e-summary-ko').textContent.trim();
  const summaryEn = document.getElementById('e-summary-en').textContent.trim();
  const cat = 'general';
  const rt = document.getElementById('e-readtime').value || '5';

  if (!author || !titleKo) { showToast(T[lang].toastErr); return; }

  const btn = document.getElementById('btn-publish');
  btn.disabled = true;
  btn.textContent = T[lang].toastSaving;

  try {
    let error;
    if (editingColumnId) {
      // 수정 모드
      ({ error } = await db.from('columns').update({
        title_ko: titleKo, title_en: titleEn||titleKo,
        body_ko: bodyKo, body_en: bodyEn||bodyKo,
        summary_ko: summaryKo||titleKo.slice(0,60),
        summary_en: summaryEn||titleEn.slice(0,60)||titleKo.slice(0,60),
        author, read_time: rt,
        thumbnail: thumbnailBase64||null
      }).eq('id', editingColumnId));
    } else {
      // 신규 등록
      ({ error } = await db.from('columns').insert({
        title_ko: titleKo, title_en: titleEn||titleKo,
        body_ko: bodyKo, body_en: bodyEn||bodyKo,
        summary_ko: summaryKo||titleKo.slice(0,60),
        summary_en: summaryEn||titleEn.slice(0,60)||titleKo.slice(0,60),
        author, category: cat, read_time: rt,
      thumbnail: thumbnailBase64||null
      }));
    }
    if (error) throw error;
    // Reload columns
    allColumns = await fetchColumns();
    renderHome(); renderAll();
    document.getElementById('editor-page').classList.remove('open');
    document.body.style.overflow = '';
    clearEditor();
    showToast(editingColumnId ? (lang==='ko' ? '✓ 칼럼이 수정됐습니다!' : '✓ Column updated!') : T[lang].toastOk);
    editingColumnId = null;
  } catch(e) {
    console.error(e);
    showToast('오류가 발생했습니다: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = T[lang].btnPublish;
  }
}

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── KEYBOARD ──
document.addEventListener('keydown', e => { if(e.key==='Escape') closeAll(); });

// ── FIX: PASTE SCROLL BUG ──
// When pasting inside editor-page, prevent window from jumping to top
document.addEventListener('paste', (e) => {
  const editorPage = document.getElementById('editor-page');
  if (editorPage && editorPage.classList.contains('open')) {
    const origScrollTo = window.scrollTo.bind(window);
    window.scrollTo = () => {};
    setTimeout(() => { window.scrollTo = origScrollTo; }, 300);
  }
}, true);

// ── INIT ──
(async () => {
  allColumns = await fetchColumns();
  showPage('home');
  setLang('ko');
})();
</script>
